name: SmartBiz MVP CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest

      - name: Run regression suite
        run: python -m pytest -q

      - name: Build production container
        run: docker build -t smartbiz-mvp:test .

  deploy-production:
    needs: test-and-build
    if: github.ref == 'refs/heads/feature/confirmed-appointment-booking' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render backend deploy when hook is configured
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Verify backend health
        run: |
          for i in {1..24}; do
            if curl --fail --silent --show-error https://smartbiz-mvp.onrender.com/health; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=smartbiz-mvp --branch=main

      - name: Verify public website
        run: |
          for i in {1..18}; do
            if curl --fail --silent --show-error https://www.smartbizfire.co.za/ >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1
