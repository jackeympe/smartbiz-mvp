services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartbiz-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SMARTBIZ_ENV: ${SMARTBIZ_ENV:-production}
      DB_PATH: /app/data/smartbiz.sqlite
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - smartbiz_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  smartbiz_data:
